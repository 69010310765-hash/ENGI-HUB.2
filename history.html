<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>History | ENGI HUB</title>

    <link rel="stylesheet"
          href="css/style.css">

    <style>

        /* ========================================
           HISTORY NAVBAR
        ======================================== */

        nav .menu a,
        nav .menu a:link,
        nav .menu a:visited,
        nav .menu a:active {
            color: #ffffff !important;
            text-decoration: none !important;
        }

        nav .menu a:hover {
            color: #60a5fa !important;
            text-decoration: none !important;
        }


        /* ========================================
           DARK MODE NAVBAR
        ======================================== */

        body.dark-mode nav .menu a,
        body.dark-mode nav .menu a:link,
        body.dark-mode nav .menu a:visited,
        body.dark-mode nav .menu a:active {
            color: #ffffff !important;
        }

        body.dark-mode nav .menu a:hover {
            color: #60a5fa !important;
        }


        /* ========================================
           HISTORY PAGE
        ======================================== */

        .history-header {
            text-align: center;
            padding: 70px 20px 40px;
        }

        .history-header h1 {
            margin-bottom: 10px;
        }

        .history-header p {
            margin: 0;
            color: #64748b;
        }


        .history-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }


        .history-card {
            background: #ffffff;
            border-radius: 18px;
            padding: 25px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        }


        .history-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
        }


        .history-top h2 {
            margin: 0;
        }


        .clear-history-button {
            border: none;
            background: #ef4444;
            color: #ffffff;
            padding: 10px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
        }


        .clear-history-button:hover {
            background: #dc2626;
        }


        /* ========================================
           EMPTY HISTORY
        ======================================== */

        .empty-history {
            text-align: center;
            padding: 60px 20px;
            color: #64748b;
        }


        .empty-icon {
            font-size: 55px;
            margin-bottom: 15px;
        }


        .empty-history h3 {
            color: #334155;
            margin-bottom: 10px;
        }


        .history-button {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 20px;
            background: #2563eb;
            color: #ffffff !important;
            text-decoration: none !important;
            border-radius: 10px;
        }


        .history-button:visited {
            color: #ffffff !important;
        }


        .history-button:hover {
            background: #1d4ed8;
            color: #ffffff !important;
        }


        /* ========================================
           DARK MODE HISTORY
        ======================================== */

        body.dark-mode .history-card {
            background: #1e293b;
        }

        body.dark-mode .history-header p {
            color: #94a3b8;
        }

        body.dark-mode .empty-history {
            color: #94a3b8;
        }

        body.dark-mode .empty-history h3 {
            color: #e2e8f0;
        }


        /* ========================================
           MOBILE
        ======================================== */

        @media (max-width: 700px) {

            .history-top {
                flex-direction: column;
                align-items: stretch;
            }

            .clear-history-button {
                width: 100%;
            }

        }

    </style>

</head>


<body>


    <!-- ========================================
         NAVBAR
    ======================================== -->

    <nav>

        <div class="logo">
            ⚙ ENGI HUB
        </div>


        <div class="menu">

            <a href="index.html">
                Home
            </a>

            <a href="index.html#tools">
                Tools
            </a>

            <a href="formulas.html">
                Formulas
            </a>

            <a href="history.html">
                History
            </a>

            <a href="index.html#about">
                About
            </a>


            <button
                id="darkModeBtn"
                class="dark-mode-btn"
                type="button">

                🌙

            </button>

        </div>

    </nav>


    <!-- ========================================
         HISTORY HEADER
    ======================================== -->

    <section class="history-header">

        <h1>
            🕘 Calculation History
        </h1>

        <p>
            ประวัติการคำนวณจากเครื่องมือทางวิศวกรรม
        </p>

    </section>


    <!-- ========================================
         HISTORY CONTENT
    ======================================== -->

    <main class="history-container">

        <div class="history-card">


            <div class="history-top">

                <h2>
                    Recent Calculations
                </h2>


                <button
                    type="button"
                    class="clear-history-button">

                    🗑 Clear History

                </button>

            </div>


            <div id="historyList">

                <div class="empty-history">

                    <div class="empty-icon">
                        🧮
                    </div>

                    <h3>
                        ยังไม่มีประวัติการคำนวณ
                    </h3>

                    <p>
                        เมื่อคุณใช้เครื่องมือคำนวณ
                        ประวัติการคำนวณจะแสดงที่นี่
                    </p>


                    <a
                        href="index.html#tools"
                        class="history-button">

                        🛠 ไปที่ Engineering Tools →

                    </a>

                </div>

            </div>

        </div>

    </main>


    <!-- ========================================
         FOOTER
    ======================================== -->

    <footer>

        <p>
            © 2026 ENGI HUB
        </p>

        <p>
            Engineering Calculation Tools
        </p>

    </footer>


    <!-- ========================================
         JAVASCRIPT
    ======================================== -->

    <script src="js/history.js"></script>

    <script src="js/darkmode.js"></script>


</body>

</html>
